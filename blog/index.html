<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIZXRAY Blog — Free Business Diagnostic</title>
<style>
  :root{
    --ink:#12181f; --paper:#eef1ee; --line:#c9cfc7;
    --brass:#8a6d3b; --brass-bright:#b48c4a; --panel:#ffffff; --muted:#5a6459;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;min-height:100vh;}
  .wrap{max-width:720px;margin:0 auto;padding:56px 24px 96px;}
  header{border-bottom:2px solid var(--ink);padding-bottom:20px;margin-bottom:36px;}
  .eyebrow{font-family:'Helvetica Neue',Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;
    font-size:11px;color:var(--brass);font-weight:700;}
  .eyebrow a{color:var(--brass);text-decoration:none;}
  h1{font-size:2.1rem;margin:6px 0 8px;font-weight:400;}
  .post{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brass);
    padding:22px 26px;margin-bottom:18px;}
  .post a{font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;font-size:19px;color:var(--ink);
    text-decoration:none;}
  .post a:hover{color:var(--brass);}
  .post p{font-family:'Helvetica Neue',Arial,sans-serif;font-size:14px;color:var(--muted);margin:8px 0 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"><a href="/">BIZXRAY</a> · Blog</div>
    <h1>Notes on getting found and getting hired</h1>
  </header>
  <div class="post">
    <a href="/blog/is-your-website-losing-you-customers.html">Is Your Website Actually Losing You Customers?</a>
    <p>A free, 2-minute check for UK trade and service businesses.</p>
  </div>
</div>
</body>
</html>
